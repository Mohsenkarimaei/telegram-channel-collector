name: M&K Telegram Collector

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Run collector
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SOURCE: '@BarbieLand_shop'
          TELEGRAM_DESTINATION: '@manto_omde_mk'
          SOURCE_CODE: 'CH-001'
          PRICE_TYPE: 'percent'
          PRICE_VALUE: '0'
          WHATSAPP_NUMBER: '09384712198'
          ORDER_ID: '@pakhshe_mk'
        run: python bot/main.py
